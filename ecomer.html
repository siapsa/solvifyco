<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Solvify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #7b3cff;
      --primary-soft: #f3ecff;
      --accent: #ff4f9a;
      --bg: #f7f7fb;
      --text: #222;
      --muted: #777;
      --card: #fff;
      --border: #e2e2ee;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    /* NAVBAR */
    .navbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }


    .nav-links {
      display: flex;
      gap: 1rem;
      font-size: 0.95rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }

    .nav-links a.active {
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .icon-btn {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 5px;
      border-radius: 999px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .user-select {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      background: #fff;
    }

    /* LAYOUT */
    .page {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
      }
    }

    /* SIDEBAR */
    .sidebar {
      background: #fff;
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
    }

    .sidebar h3 {
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }

    .price-range {
      margin-bottom: 1.5rem;
    }

    .price-values {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .categories {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      cursor: pointer;
      background: #fff;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }

    /* MAIN CONTENT */
    .main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filters-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
    }

    .search-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 0.9rem;
    }

    .select-inline {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      background: #fff;
    }

    .view-toggle {
      display: flex;
      gap: 0.4rem;
    }

    .view-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .view-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* CARDS GRID */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
    }    

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      cursor: pointer;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .card:hover {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      transform: translateY(-2px);
    }

.card-img {
  background: #f0f2ff;
  border-radius: 8px;
  height: 180px;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  font-size: 0.8rem;
  color: #fff;
  position: relative;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.card-img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.55),
    rgba(0, 0, 0, 0.05)
  );
}

.card-img span {
  position: relative;
  z-index: 2;
  padding: 12px;
  font-size: 0.85rem;
  font-weight: 500;
}

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .card-price {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-outline {
      border-radius: 999px;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: transparent;
      padding: 0.25rem 0.7rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      
      <nav class="nav-links">
        <a href="#" class="active" onclick="window.location.href='index.html'" >Inicio</a>
        
      </nav>
    </div>
    <div class="nav-right">
    
      
      <button
  id="btnContactenos"
  class="btn-primary">
  Contáctenos
</button>
      
    </div>
  </header>

  <!-- CONTENT -->
  <main class="page">
     <!-- SIDEBAR -->
    <aside class="sidebar">
      <section class="price-range">
        <h3>Rango de precio</h3>

        <input type="range" min="100" max="500" step="25" value="500" id="priceRange" style="width:100%;">

        <div class="price-values">
          <span>100,00 B/.</span>
          <span id="priceValue">250,00 B/.</span>
          <span>500,00 B/.</span>
        </div>
      </section>

      
<section class="zones">
  <h3>Zonas</h3>

  <div class="categories" id="zoneFilters">
    <button class="chip active" data-zone="all">Todas</button>
    <button class="chip" data-zone="panama">Ciudad de Panamá</button>
    <button class="chip" data-zone="oeste">Panamá Oeste</button>
    <button class="chip" data-zone="colon">Colón</button>
    <button class="chip" data-zone="chiriqui">Chiriquí</button>
    <button class="chip" data-zone="veraguas">Veraguas</button>
    <button class="chip" data-zone="cocle">Coclé</button>
  </div>
</section>
<br></br>

<section class="services">
  <h3>Servicios</h3>

  <div class="categories" id="serviceFilters">
    <button class="chip active" data-service="all">Todos</button>
    <button class="chip" data-service="electricista">Electricista</button>
    <button class="chip" data-service="ebanista">Ebanista</button>
    <button class="chip" data-service="albanil">Albañil</button>
    <button class="chip" data-service="abogado">Abogado</button>
    <button class="chip" data-service="mantenimiento">Mantenimiento</button>
  </div>
</section>


</aside>

    <!-- MAIN -->
    <section class="main">

      <div class="cards" id="cardsContainer"></div>

    </section>
  </main>

  <!-- ✅ SCRIPT MEJORADO -->

<script>

let cards = [];

async function cargarTecnicos() {

  try {

    const res = await fetch("https://solvifyco-backend.onrender.com/tecnicos");

    const tecnicos = await res.json();

    const container =
      document.getElementById("cardsContainer");

function obtenerImagenServicio(servicio) {

  const imagenes = {
    electricista: "imagenes/electricista.jpg",
    mantenimiento: "imagenes/mantenimiento.jpg",
    ebanista: "imagenes/ebanista.jpg",
    albanil: "imagenes/albanil.jpg",
    abogado: "imagenes/abogado.jpg"
  };

  return imagenes[servicio] || "imagenes/default.jpg";
}

    container.innerHTML = "";

    tecnicos.forEach(tecnico => {

      const imagenServicio = obtenerImagenServicio(tecnico.servicio);

      container.innerHTML += `
        <article
          class="card"
        data-price="${tecnico.precio}"
        data-zone="${tecnico.zona}"
        data-service="${tecnico.servicio}">

        <div
      class="card-img"
      style="background-image: url('${imagenServicio}')">
      <span>${tecnico.descripcion}</span>
    </div>

          <div class="card-title">
            ${tecnico.nombre}
            ${tecnico.premium ? "⭐ Premium" : ""}
          </div>

          <div class="card-price">
            ${tecnico.precio} B/.
          </div>

          <div class="card-footer">

            <span>📍 ${tecnico.ciudad}</span>

            <a
              class="btn-outline"
              href="especialistacp.html?id=${tecnico.id}">
              Ver detalles
          </a>
          </div>

        </article>
      `;
    });

    cards = document.querySelectorAll(".card");

    filtrar();

  } catch (error) {

    console.error(error);

  }
}

  const range = document.getElementById('priceRange');
  const priceValue = document.getElementById('priceValue');
  const zones = document.querySelectorAll('#zoneFilters .chip');
  const services = document.querySelectorAll('#serviceFilters .chip');

  let zonaSeleccionada = "all";
  let servicioSeleccionado = "all";

  function filtrar() {
    const maxPrecio = parseInt(range.value);

    cards.forEach(card => {
      const precio = parseInt(card.getAttribute('data-price'));
      const zona = card.getAttribute('data-zone');
      const servicio = card.getAttribute('data-service');

      const cumplePrecio = precio <= maxPrecio;
      const cumpleZona = zonaSeleccionada === "all" || zona === zonaSeleccionada;
      const cumpleServicio = servicioSeleccionado === "all" || servicio === servicioSeleccionado;

      if (cumplePrecio && cumpleZona && cumpleServicio) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });
  }

  // SLIDER PRECIO
  range.addEventListener('input', () => {
    priceValue.textContent = range.value + ',00 B/.';
    filtrar();
  });

  // ZONAS
  zones.forEach(zone => {
    zone.addEventListener('click', () => {
      zones.forEach(z => z.classList.remove('active'));
      zone.classList.add('active');

      zonaSeleccionada = zone.getAttribute('data-zone');
      filtrar();
    });
  });

  // SERVICIOS ✅ NUEVO
  services.forEach(service => {
    service.addEventListener('click', () => {
      services.forEach(s => s.classList.remove('active'));
      service.classList.add('active');

      servicioSeleccionado = service.getAttribute('data-service');

      filtrar();
    });
  });

  // INICIAL
  cargarTecnicos();
</script>



</body>
</html>
