<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Solvify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #7b3cff;
      --primary-soft: #f3ecff;
      --accent: #ff4f9a;
      --bg: #f7f7fb;
      --text: #222;
      --muted: #777;
      --card: #fff;
      --border: #e2e2ee;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }
.registro-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.registro-modal-content {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 1.5rem;
}

.registro-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.5rem;
}

.registro-modal-header h2 {
  margin-bottom: 0.3rem;
}

.registro-modal-header p {
  color: var(--muted);
  font-size: 0.85rem;
}

.registro-modal-content h3 {
  font-size: 0.95rem;
  margin: 1.2rem 0 0.7rem;
}

.registro-modal-content label {
  display: block;
  font-size: 0.85rem;
  margin: 0.7rem 0 0.3rem;
}

.registro-modal-content input,
.registro-modal-content textarea,
.registro-modal-content select {
  width: 100%;
  padding: 0.55rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  font-size: 0.9rem;
}

.registro-modal-content textarea {
  min-height: 80px;
  resize: vertical;
}

.planes-registro {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.2rem;
}

.planes-registro label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
}

.planes-registro input {
  width: auto;
}

.registro-modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 0.7rem;
  margin-top: 1.5rem;
}
    /* NAVBAR */
    .navbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }


    .nav-links {
      display: flex;
      gap: 1rem;
      font-size: 0.95rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }

    .nav-links a.active {
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .icon-btn {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 5px;
      border-radius: 999px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .user-select {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      background: #fff;
    }

    /* LAYOUT */
    .page {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
      }
    }

    /* SIDEBAR */
    .sidebar {
      background: #fff;
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
    }

    .sidebar h3 {
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }

    .price-range {
      margin-bottom: 1.5rem;
    }

    .price-values {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .categories {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      cursor: pointer;
      background: #fff;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }

    /* MAIN CONTENT */
    .main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filters-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
    }

    .search-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 0.9rem;
    }

    .select-inline {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      background: #fff;
    }

    .view-toggle {
      display: flex;
      gap: 0.4rem;
    }

    .view-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .view-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* CARDS GRID */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
    }    

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      cursor: pointer;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .card:hover {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      transform: translateY(-2px);
    }

.card-img {
  background: #f0f2ff;
  border-radius: 8px;
  height: 180px;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  font-size: 0.8rem;
  color: #fff;
  position: relative;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.card-img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.55),
    rgba(0, 0, 0, 0.05)
  );
}

.card-img span {
  position: relative;
  z-index: 2;
  padding: 12px;
  font-size: 0.85rem;
  font-weight: 500;
}

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .card-price {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-outline {
      border-radius: 999px;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: transparent;
      padding: 0.25rem 0.7rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      
      <nav class="nav-links">
        <a href="#" class="active" onclick="window.location.href='index.html'" >Inicio</a>
        
      </nav>
    </div>
    <div class="nav-right">
    
      
      <button
  id="btnContactenos"
  class="btn-primary">
  Contáctenos
</button>
      
    </div>
  </header>

  <!-- CONTENT -->
  <main class="page">
     <!-- SIDEBAR -->
    <aside class="sidebar">
      <section class="price-range">
        <h3>Rango de precio</h3>

        <input type="range" min="100" max="500" step="25" value="500" id="priceRange" style="width:100%;">

        <div class="price-values">
          <span>100,00 B/.</span>
          <span id="priceValue">250,00 B/.</span>
          <span>500,00 B/.</span>
        </div>
      </section>

      
<section class="zones">
  <h3>Zonas</h3>

  <div class="categories" id="zoneFilters">
    <button class="chip active" data-zone="all">Todas</button>
    <button class="chip" data-zone="panama">Ciudad de Panamá</button>
    <button class="chip" data-zone="oeste">Panamá Oeste</button>
    <button class="chip" data-zone="colon">Colón</button>
    <button class="chip" data-zone="chiriqui">Chiriquí</button>
    <button class="chip" data-zone="veraguas">Veraguas</button>
    <button class="chip" data-zone="cocle">Coclé</button>
  </div>
</section>
<br></br>

<section class="services">
  <h3>Servicios</h3>

  <div class="categories" id="serviceFilters">
    <button class="chip active" data-service="all">Todos</button>
    <button class="chip" data-service="electricista">Electricista</button>
    <button class="chip" data-service="ebanista">Ebanista</button>
    <button class="chip" data-service="albanil">Albañil</button>
    <button class="chip" data-service="abogado">Abogado</button>
    <button class="chip" data-service="mantenimiento">Mantenimiento</button>
  </div>
</section>


</aside>

    <!-- MAIN -->
    <section class="main">

      <div class="cards" id="cardsContainer"></div>

    </section>
  </main>
<!-- =========================================================
     MODAL - REGISTRO DE ESPECIALISTA
========================================================= -->

<div id="registroModal" class="registro-modal">

  <div class="registro-modal-content">


<div class="registro-modal-header">
  <div>
    <h2>Regístrate como especialista</h2>
    <p>Ofrece tus servicios a través de Solvify.</p>
  </div>

  <button
    type="button"
    id="cerrarRegistroModal"
    class="icon-btn">
    ×
  </button>
</div>


<form id="registroTecnicoForm">

  <h3>Datos personales</h3>

  <label for="registroNombre">Nombre completo</label>
  <input
    type="text"
    id="registroNombre"
    name="nombre"
    placeholder="Ej. Roberto Jiménez"
    required>


  <label for="registroTelefono">Teléfono</label>
  <input
    type="tel"
    id="registroTelefono"
    name="telefono"
    placeholder="+507 6000-0000"
    required>


  <label for="registroCorreo">Correo electrónico</label>
  <input
    type="email"
    id="registroCorreo"
    name="correo"
    placeholder="correo@ejemplo.com"
    required>


  <h3>Información del servicio</h3>

  <label for="registroServicio">Servicio</label>

  <select
    id="registroServicio"
    name="servicio"
    class="select-inline"
    required>

    <option value="">Selecciona un servicio</option>
    <option value="electricista">Electricista</option>
    <option value="ebanista">Ebanista</option>
    <option value="albanil">Albañil</option>
    <option value="abogado">Abogado</option>
    <option value="mantenimiento">Mantenimiento</option>

  </select>


  <label for="registroDescripcion">Descripción</label>

  <textarea
    id="registroDescripcion"
    name="descripcion"
    placeholder="Describe brevemente tus servicios"
    required></textarea>


  <label for="registroPrecio">Precio del servicio</label>

  <select
    id="registroPrecio"
    name="precio"
    class="select-inline"
    required>

    <option value="">Selecciona un precio</option>

    <option value="100">100,00 B/.</option>
    <option value="125">125,00 B/.</option>
    <option value="150">150,00 B/.</option>
    <option value="175">175,00 B/.</option>
    <option value="200">200,00 B/.</option>
    <option value="225">225,00 B/.</option>
    <option value="250">250,00 B/.</option>
    <option value="275">275,00 B/.</option>
    <option value="300">300,00 B/.</option>
    <option value="325">325,00 B/.</option>
    <option value="350">350,00 B/.</option>
    <option value="375">375,00 B/.</option>
    <option value="400">400,00 B/.</option>
    <option value="425">425,00 B/.</option>
    <option value="450">450,00 B/.</option>
    <option value="475">475,00 B/.</option>
    <option value="500">500,00 B/.</option>

  </select>


  <label for="registroZona">Zona</label>

  <select
    id="registroZona"
    name="zona"
    class="select-inline"
    required>

    <option value="">Selecciona una zona</option>

    <option value="panama">
      Ciudad de Panamá
    </option>

    <option value="oeste">
      Panamá Oeste
    </option>

    <option value="colon">
      Colón
    </option>

    <option value="chiriqui">
      Chiriquí
    </option>

    <option value="veraguas">
      Veraguas
    </option>

    <option value="cocle">
      Coclé
    </option>

  </select>


  <label for="registroCiudad">Ciudad</label>

  <input
    type="text"
    id="registroCiudad"
    name="ciudad"
    placeholder="Ej. Ciudad de Panamá"
    required>


  <h3>Plan</h3>

  <div class="planes-registro">

    <label>
      <input
        type="radio"
        name="plan"
        value="basico"
        checked>

      Básico — Gratis
    </label>


    <label>
      <input
        type="radio"
        name="plan"
        value="premium">

      Premium — 5,00 B/. mensual
    </label>

  </div>


  <div class="registro-modal-buttons">

    <button
      type="button"
      id="cancelarRegistro"
      class="btn-outline">
      Cancelar
    </button>

    <button
      type="submit"
      class="btn-primary">
      Registrarme
    </button>

  </div>

</form>


  </div>

</div>

  <!-- ✅ SCRIPT MEJORADO -->

<script>

// =========================================================
// MODAL REGISTRO DE ESPECIALISTA
// =========================================================

const btnContactenos = document.getElementById("btnContactenos");
const registroModal = document.getElementById("registroModal");
const cerrarRegistroModal = document.getElementById("cerrarRegistroModal");
const cancelarRegistro = document.getElementById("cancelarRegistro");

// Abrir modal
btnContactenos.addEventListener("click", () => {
  registroModal.style.display = "flex";
});

// Cerrar modal con X
cerrarRegistroModal.addEventListener("click", () => {
  registroModal.style.display = "none";
});

// Cerrar modal con Cancelar
cancelarRegistro.addEventListener("click", () => {
  registroModal.style.display = "none";
});

// Cerrar haciendo clic fuera del modal
registroModal.addEventListener("click", (event) => {

  if (event.target === registroModal) {
    registroModal.style.display = "none";
  }

});  

let cards = [];

async function cargarTecnicos() {

  try {

    const res = await fetch("https://solvifyco-backend.onrender.com/tecnicos");

    const tecnicos = await res.json();

    const container =
      document.getElementById("cardsContainer");

function obtenerImagenServicio(servicio) {

  const imagenes = {
    electricista: "imagenes/electricista.jpg",
    mantenimiento: "imagenes/mantenimiento.jpg",
    ebanista: "imagenes/ebanista.jpg",
    albanil: "imagenes/albanil.jpg",
    abogado: "imagenes/abogado.jpg"
  };

  return imagenes[servicio] || "imagenes/default.jpg";
}

    container.innerHTML = "";

    tecnicos.forEach(tecnico => {

      const imagenServicio = obtenerImagenServicio(tecnico.servicio);

      container.innerHTML += `
        <article
          class="card"
        data-price="${tecnico.precio}"
        data-zone="${tecnico.zona}"
        data-service="${tecnico.servicio}">

        <div
      class="card-img"
      style="background-image: url('${imagenServicio}')">
      <span>${tecnico.descripcion}</span>
    </div>

          <div class="card-title">
            ${tecnico.nombre}
            ${tecnico.premium ? "⭐ Premium" : ""}
          </div>

          <div class="card-price">
            ${tecnico.precio} B/.
          </div>

          <div class="card-footer">

            <span>📍 ${tecnico.ciudad}</span>

            <a
              class="btn-outline"
              href="especialistacp.html?id=${tecnico.id}">
              Ver detalles
          </a>
          </div>

        </article>
      `;
    });

    cards = document.querySelectorAll(".card");

    filtrar();

  } catch (error) {

    console.error(error);

  }
}

  const range = document.getElementById('priceRange');
  const priceValue = document.getElementById('priceValue');
  const zones = document.querySelectorAll('#zoneFilters .chip');
  const services = document.querySelectorAll('#serviceFilters .chip');

  let zonaSeleccionada = "all";
  let servicioSeleccionado = "all";

  function filtrar() {
    const maxPrecio = parseInt(range.value);

    cards.forEach(card => {
      const precio = parseInt(card.getAttribute('data-price'));
      const zona = card.getAttribute('data-zone');
      const servicio = card.getAttribute('data-service');

      const cumplePrecio = precio <= maxPrecio;
      const cumpleZona = zonaSeleccionada === "all" || zona === zonaSeleccionada;
      const cumpleServicio = servicioSeleccionado === "all" || servicio === servicioSeleccionado;

      if (cumplePrecio && cumpleZona && cumpleServicio) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });
  }

  // SLIDER PRECIO
  range.addEventListener('input', () => {
    priceValue.textContent = range.value + ',00 B/.';
    filtrar();
  });

  // ZONAS
  zones.forEach(zone => {
    zone.addEventListener('click', () => {
      zones.forEach(z => z.classList.remove('active'));
      zone.classList.add('active');

      zonaSeleccionada = zone.getAttribute('data-zone');
      filtrar();
    });
  });

  // SERVICIOS ✅ NUEVO
  services.forEach(service => {
    service.addEventListener('click', () => {
      services.forEach(s => s.classList.remove('active'));
      service.classList.add('active');

      servicioSeleccionado = service.getAttribute('data-service');

      filtrar();
    });
  });

  // INICIAL
  cargarTecnicos();
</script>



</body>
</html>
