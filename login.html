<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvify | Login Admin</title>

<style>

:root{
  --primary:#7b3cff;
  --primary-soft:#f4ecff;
  --text:#222;
  --muted:#777;
  --border:#e2e2ee;
  --bg:#f7f7fb;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{

  width:100%;
  max-width:420px;

  background:white;

  border:1px solid var(--border);

  border-radius:20px;

  padding:30px;

  box-shadow:
    0 20px 40px rgba(0,0,0,0.08);

}

.logo{

  text-align:center;

  color:var(--primary);

  font-size:2rem;

  font-weight:700;

  margin-bottom:10px;

}

.subtitulo{

  text-align:center;

  color:var(--muted);

  margin-bottom:25px;

  font-size:.9rem;

}

.form-group{

  margin-bottom:15px;

}

label{

  display:block;

  margin-bottom:6px;

  font-size:.85rem;

  font-weight:600;

}

input{

  width:100%;

  padding:12px;

  border:1px solid var(--border);

  border-radius:10px;

  outline:none;

}

input:focus{

  border-color:var(--primary);

  box-shadow:0 0 0 3px var(--primary-soft);

}

.btn{

  width:100%;

  padding:12px;

  border:none;

  border-radius:999px;

  background:var(--primary);

  color:white;

  cursor:pointer;

  font-weight:600;

  font-size:.95rem;

}

.btn:hover{

  background:#6527f0;

}

.error{

  margin-top:12px;

  color:#dc2626;

  text-align:center;

  font-size:.85rem;

}

</style>
</head>

<body>

<div class="card">

  <div class="logo">
    Solvify
  </div>

  <div class="subtitulo">
    Acceso al panel de administración
  </div>

  <form id="loginForm">

    <div class="form-group">

      <label>Usuario</label>

      <input
        type="text"
        id="usuario"
        required>

    </div>

    <div class="form-group">

      <label>Contraseña</label>

      <input
        type="password"
        id="password"
        required>

    </div>

    <button
      type="submit"
      class="btn">

      Iniciar sesión

    </button>

    <div
      id="error"
      class="error">

    </div>

  </form>

</div>

<script>

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
   async function(e){

      e.preventDefault();

      const usuario =
        document.getElementById(
          "usuario"
        ).value;

      const password =
        document.getElementById(
          "password"
        ).value;
try {
 const res =
  await fetch(
    "https://solvifyco-backend.onrender.com/login",
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        usuario,
        password
      })
    }
  );

const data =
  await res.json();

if (data.ok) {

  localStorage.setItem(
    "adminLogueado",
    "true"
  );

  window.location.href =
    "admin.html";

} else {

  document.getElementById(
    "error"
  ).textContent =
    "Usuario o contraseña incorrectos.";

}
  
} catch(error) {

document.getElementById("error").textContent = "No se pudo conectar con el servidor.";}
}
);
  
</script>

</body>
</html>
